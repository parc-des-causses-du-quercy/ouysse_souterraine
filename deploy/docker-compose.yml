services:
  hydro-forecast-api:
    image: {YOUR_REGISTRY}/hydro-forecast-ouysse:latest
    container_name: hydro-forecast-api

    ports:
      - "${API_PORT:-5000}:5000"

    volumes:
      - ./configs:/app/configs
      - ./states:/app/states
      - ./backups:/app/backups
      - ./data:/app/data

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
